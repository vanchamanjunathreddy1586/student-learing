<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Smart Learning</title><link rel="stylesheet" href="/css/page.css"></head><body><main class="page"><nav class="page-nav"><a class="page-brand" href="/">smart <span>learning</span></a><a href="/login.html">Log in</a></nav><section class="panel"><p class="eyebrow">START LEARNING</p><h1>Your next breakthrough starts here.</h1><p>Create a private learner profile with Supabase Auth.</p><form id="register-form"><p><label>Name<br><input id="name" required></label></p><p><label>Email<br><input id="email" required type="email"></label></p><p><label>Password<br><input id="password" required type="password" minlength="6"></label></p><p id="form-error" role="alert"></p><button class="action" type="submit">Create account</button></form></section></main><script type="module">import { signUp } from '/js/auth.js'; document.querySelector('#register-form').addEventListener('submit', async (event) => { event.preventDefault(); const error = document.querySelector('#form-error'); error.textContent = ''; try { const { data, error: authError } = await signUp(document.querySelector('#email').value, document.querySelector('#password').value, document.querySelector('#name').value); if (authError) throw authError; window.location.assign(data.session ? '/dashboard.html' : '/login.html'); } catch (authError) { error.textContent = authError.message; } });</script></body></html>
