<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Diary Login - Student Learning</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/diary-login.css">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/theme-manager.js"></script>
</head>
<body data-theme="dark">

  <!-- Glowing background elements -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Loading State -->
  <div id="auth-loading" class="auth-loading" style="display: flex;">
    <div class="spinner"></div>
    <p>Verifying secure session...</p>
  </div>

  <button class="back-btn" id="btn-back-dashboard">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
  </button>

  <div class="auth-wrapper" id="auth-wrapper" style="display: none;">
    <div class="auth-card">
      <div class="auth-header">
        <div class="lock-icon-container">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h1 id="auth-title">Personal Diary</h1>
        <p id="auth-subtitle">Private & Secure</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="form-login" class="auth-form" style="display: none;">
        <div class="form-group">
          <label>Diary Email</label>
          <div class="input-container">
            <i class="fas fa-envelope icon"></i>
            <input type="email" id="login-email" required placeholder="Enter diary email" autocomplete="email">
          </div>
        </div>
        
        <div class="form-group">
          <label>Diary Password</label>
          <div class="input-container">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="login-password" required placeholder="Enter diary password" autocomplete="current-password">
            <button type="button" class="btn-toggle-password"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        
        <div class="form-actions">
          <a href="#" id="link-forgot-password" class="text-link">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn-primary" id="btn-login">
          <i class="fas fa-sign-in-alt"></i> Unlock Diary
        </button>
        
        <p class="auth-switch">First time here? <a href="#" id="link-show-register">Create Diary Account</a></p>
      </form>

      <!-- REGISTER FORM -->
      <form id="form-register" class="auth-form" style="display: none;">
        <p class="notice-text"><i class="fas fa-info-circle"></i> This is a separate secure account just for your Diary.</p>
        
        <div class="form-group">
          <label>Diary Email</label>
          <div class="input-container">
            <i class="fas fa-envelope icon"></i>
            <input type="email" id="reg-email" required placeholder="Choose a diary email">
          </div>
        </div>
        
        <div class="form-group">
          <label>Diary Password</label>
          <div class="input-container">
            <i class="fas fa-lock icon"></i>
            <input type="password" id="reg-password" required placeholder="Create strong password" minlength="6">
            <button type="button" class="btn-toggle-password"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        
        <div class="form-group">
          <label>6-Digit Security PIN</label>
          <div class="input-container">
            <i class="fas fa-key icon"></i>
            <input type="password" id="reg-pin" inputmode="numeric" required placeholder="Create 6-digit PIN" minlength="4" maxlength="6" pattern="[0-9]*">
          </div>
          <small>Required for sensitive actions.</small>
        </div>
        
        <button type="submit" class="btn-primary" id="btn-register">
          <i class="fas fa-user-shield"></i> Create Secure Diary
        </button>
        
        <p class="auth-switch">Already have a diary account? <a href="#" id="link-show-login">Login</a></p>
      </form>
      
    </div>
  </div>

  <script type="module" src="/js/diary-login.js"></script>
</body>
</html>
