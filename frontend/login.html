<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | Smart Learning</title><link rel="stylesheet" href="/css/page.css"></head><body><main class="page"><nav class="page-nav"><a class="page-brand" href="/">smart <span>learning</span></a><a href="/register.html">Create account</a></nav><section class="panel"><p class="eyebrow">WELCOME BACK</p><h1>Return to your learning path.</h1><p>Supabase Auth keeps your classroom, progress, and AI memory private.</p><form id="login-form"><p><label>Email<br><input id="email" required type="email"></label></p><p><label>Password<br><input id="password" required type="password"></label></p><p id="form-error" role="alert"></p><button class="action" type="submit">Log in</button></form></section></main><script type="module">import { signIn } from '/js/auth.js'; document.querySelector('#login-form').addEventListener('submit', async (event) => { event.preventDefault(); const error = document.querySelector('#form-error'); error.textContent = ''; try { const { error: authError } = await signIn(document.querySelector('#email').value, document.querySelector('#password').value); if (authError) throw authError; window.location.assign('/dashboard.html'); } catch (authError) { error.textContent = authError.message; } });</script></body></html>
